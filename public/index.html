<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>U2-Net Background Removal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- ONNX Runtime Web (WebGPU+WASM bundle) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.22.0/ort.min.js"></script>
  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 24px; }
    .row { display:flex; flex-wrap:wrap; gap:16px; align-items:flex-start; }
    .panel { border:1px solid #ddd; border-radius:12px; padding:16px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
    canvas, img { max-width: min(48vw, 720px); height:auto; border-radius:8px; }
    label { display:block; margin:.4rem 0 .2rem; font-size:.9rem; color:#444; }
    input[type="range"] { width: 300px; }
    #status { font-size:.9rem; color:#555; margin-top:8px; }
    .controls { display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
    button { padding:.6rem 1rem; border-radius:10px; border:1px solid #ccc; background:#fff; cursor:pointer; }
    button:disabled { opacity:.6; cursor:not-allowed; }
  </style>
</head>
<body>
  <h1>U2-Net Background Removal</h1>

  <div class="controls panel">
    <div>
      <label>Choose image</label>
      <input id="fileInput" type="file" accept="image/*" />
    </div>
    <div>
      <label>Mask threshold: <span id="thrVal">0.9</span></label>
      <input id="thr" type="range" min="0" max="1" step="0.01" value="0.9" />
    </div>
    <div>
      <label>Edge feather (px): <span id="blurVal">2</span></label>
      <input id="blur" type="range" min="0" max="8" step="1" value="2" />
    </div>
    <div>
      <label>Execution provider</label>
      <select id="ep">
        <option value="auto" selected>Auto (WebGPU + WASM)</option>
        <option value="wasm">WASM (SIMD + threads)</option>
        <option value="webgpu">WebGPU</option>
      </select>
    </div>
    <div>
      <label>&nbsp;</label>
      <button id="btnRun" disabled>Remove background</button>
    </div>
    <div id="status">Model loading ...</div>
  </div>

  <div class="row">
    <div class="panel">
      <h3>Original</h3>
      <img id="inputImg" alt="input" />
    </div>
    <div class="panel">
      <h3>Cut-out (PNG)</h3>
      <canvas id="outCanvas"></canvas>
      <div style="margin-top:8px;">
        <button id="btnDownload" disabled>Download PNG</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
